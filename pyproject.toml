[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lite-description"
version = "0.5.0"
description = "URDF, MJCF and meshes for the Berkeley Humanoid Lite, and the generator that builds them from Onshape CAD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cad = [
    "mujoco>=3.4.0",
    "onshape-to-robot>=1.8.0",
    "pymeshlab>=2025.7.post1",
]

[project.scripts]
# One converter, all three formats (CAD -> URDF + MJCF + xacro).
lite-description-generate = "lite_description.workflow.generate:main"
# Individual stages (useful for partial regen without re-hitting the Onshape API).
lite-description-onshape-to-urdf = "lite_description.workflow.onshape_to_urdf:main"
lite-description-finalize-urdf = "lite_description.workflow.finalize_urdf:main"
lite-description-urdf-to-mjcf = "lite_description.workflow.urdf_to_mjcf:main"
lite-description-urdf-to-xacro = "lite_description.workflow.urdf_to_xacro:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "lite-description[cad]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["lite_description"]
# cad/ holds the generation inputs, which only the generator reads from a checkout.
exclude = ["**/cad"]

[tool.hatch.build.targets.sdist]
include = [
    "/lite_description",
    "/README.md",
    "/pyproject.toml",
]
