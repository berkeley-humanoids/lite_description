name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --group test

      - name: Run pytest
        run: uv run pytest -v

  ros:
    # The ament package builds, and the xacro tests run against the installed package.
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS build + URDF tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pytest \
            ros-jazzy-xacro \
            liburdfdom-tools \
            ros-jazzy-ament-cmake \
            ros-jazzy-ament-lint-auto \
            ros-jazzy-ament-lint-common

      - name: colcon build lite_description
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p ws/src
          # The package.xml is at the repo root, so the repo IS the package.
          ln -s "$GITHUB_WORKSPACE" ws/src/lite_description
          cd ws
          colcon build --packages-select lite_description

      - name: Test the xacro
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # The assembly xacro includes $(find lite_description)/..., the installed package.
          source "$GITHUB_WORKSPACE/ws/install/setup.bash"
          python3 -m pytest -v tests/test_ros2_artifacts.py
